# Reference NGINX config for production-style deployment (Phase B of the case study).
# NOT verified in the development environment (NGINX/Docker were unavailable) — see CLAUDE.md §14.
#
#   client ──▶ CDN (static assets) ──▶ NGINX ──▶ N stateless API replicas ──▶ Redis / MongoDB
#
# Set TRUST_PROXY=1 on the API so it reads the client IP from X-Forwarded-For.

worker_processes auto;
events { worker_connections 16384; }

http {
  # ---- coarse edge rate limiting (bad actors), before traffic reaches Node ----
  # 20 req/s per client IP with a small burst; the API applies finer per-user limits in Redis.
  limit_req_zone $binary_remote_addr zone=per_ip:20m rate=20r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

  # ---- block obvious bots at the edge ----
  map $http_user_agent $bad_ua {
    default 0;
    ""      1;
    ~*(curl|wget|python-requests|scrapy|headlesschrome|phantomjs) 1;
  }

  upstream api {
    least_conn;                       # send new requests to the least busy replica
    server api1:4000 max_fails=3 fail_timeout=5s;
    server api2:4000 max_fails=3 fail_timeout=5s;
    server api3:4000 max_fails=3 fail_timeout=5s;
    keepalive 256;                    # pooled upstream connections (no TCP handshake per request)
  }

  # Micro-cache for the public sale-status endpoint: 100k pollers → ~1 upstream hit/s.
  proxy_cache_path /var/cache/nginx/sale levels=1:2 keys_zone=sale_status:10m max_size=50m inactive=10s;

  server {
    listen 80;
    client_max_body_size 16k;

    # Static SPA (in production these are served by the CDN in front of this box)
    root /usr/share/nginx/html;
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }

    location ~ ^/api/sales/[a-f0-9]{24}$ {
      proxy_cache sale_status;
      proxy_cache_valid 200 1s;
      proxy_cache_lock on;            # collapse concurrent misses into one upstream request
      proxy_cache_use_stale updating error timeout;
      proxy_pass http://api;
      include /etc/nginx/proxy_common.conf;
    }

    location /api/checkout {
      if ($bad_ua) { return 403; }
      limit_req zone=per_ip burst=10 nodelay;
      limit_conn conn_ip 20;
      proxy_pass http://api;
      include /etc/nginx/proxy_common.conf;
    }

    location /api/ {
      limit_req zone=per_ip burst=40 nodelay;
      proxy_pass http://api;
      include /etc/nginx/proxy_common.conf;
    }
  }
}

