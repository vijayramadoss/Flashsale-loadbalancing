# Local CDN edge (pull-through cache) — a second NGINX playing the role of a
# CDN point of presence such as CloudFront / Cloudflare / Akamai.
# Start:  E:\tools\nginx-1.28.0\nginx.exe -p E:/tools/nginx-1.28.0/ -c E:/goMl/infra/cdn.local.conf
# Stop:   E:\tools\nginx-1.28.0\nginx.exe -p E:/tools/nginx-1.28.0/ -c E:/goMl/infra/cdn.local.conf -s quit
#
#   browser ──HTML + /api──▶ origin NGINX :8088 ──▶ api-1..3
#      │
#      └──/assets/*.js|css──▶ CDN edge :8090 ──(cache miss only)──▶ origin :8088
#                               │
#                               └── disk cache  E:/tools/nginx-1.28.0/temp/cdn_cache
#
# The storefront is built with `npm run build:cdn` so index.html and the JS
# chunks reference http://127.0.0.1:8090/assets/… (a different origin, like a
# real CDN hostname: CORS headers are therefore required and tested).
#
# What it does like a real CDN:
#   * caches by the origin's Cache-Control (assets: 1 year, immutable — content-hashed names)
#   * one cache entry per encoding (br / gzip / identity), so Brotli clients get Brotli
#   * request collapsing: 1,000 simultaneous misses → 1 origin request (proxy_cache_lock)
#   * serves stale copies if the origin is down or erroring (origin shield)
#   * X-Cache: HIT / MISS / EXPIRED / STALE / UPDATING and X-CDN-Edge on every response
#   * static only: /api and non-GET methods are refused at the edge
# What it does not do: geographic PoPs, TLS, purge API (not needed — a new
# deploy produces new hashed file names, so nothing is ever invalidated).

worker_processes 1;
error_log logs/cdn-error.log warn;
pid logs/cdn-nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       E:/tools/nginx-1.28.0/conf/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  log_format cdn '$time_local $request_method $uri cache=$upstream_cache_status enc=$cdn_encoding $status $body_bytes_sent';
  access_log logs/cdn-access.log cdn buffer=64k flush=2s;

  # Normalise Accept-Encoding to three values so the cache holds at most three variants per file.
  map $http_accept_encoding $cdn_encoding {
    default        "";
    "~*\bbr\b"     br;
    "~*\bgzip\b"   gzip;
  }

  upstream origin {
    server 127.0.0.1:8088;
    keepalive 16;
  }

  # Own temp dirs: the origin NGINX runs from the same prefix.
  client_body_temp_path temp/cdn_client_body;
  proxy_temp_path temp/cdn_proxy;

  proxy_cache_path E:/tools/nginx-1.28.0/temp/cdn_cache levels=1:2 keys_zone=cdn:20m
                   max_size=1g inactive=30d use_temp_path=off;

  server {
    listen 127.0.0.1:8090;
    server_name cdn.localhost;

    # Edge serves static files only — never the API or HTML documents.
    location /api/ { return 404; }
    location = / { return 404; }
    location = /index.html { return 404; }

    location / {
      limit_except GET HEAD { deny all; }

      proxy_cache cdn;
      proxy_cache_key "$uri$is_args$args|$cdn_encoding";   # query string included, like real CDNs
      proxy_cache_valid 404 10s;                  # 200s use the origin's Cache-Control
      proxy_cache_lock on;                        # collapse concurrent misses into one origin fetch
      proxy_cache_lock_timeout 5s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_revalidate on;                  # If-None-Match / If-Modified-Since to the origin
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8088;
      proxy_set_header Accept-Encoding $cdn_encoding;
      proxy_set_header User-Agent "FlashSale-CDN-Edge/1.0";   # origin's bot filter allows the edge
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_pass http://origin;

      add_header X-Cache $upstream_cache_status always;
      add_header X-CDN-Edge "local-edge-1" always;
      # The storefront (another origin) loads these as <script type=module crossorigin> → CORS.
      add_header Access-Control-Allow-Origin "*" always;
      add_header Timing-Allow-Origin "*" always;   # lets the page measure CDN timings (Resource Timing)
    }
  }
}
