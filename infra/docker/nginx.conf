# NGINX inside Docker (Linux): serves the storefront and balances /api across
# the three API containers. Same design as infra/nginx.local.conf, but with
# epoll + one worker per CPU and per-IP limits keyed on the real client address.
worker_processes auto;
events { worker_connections 8192; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  log_format lb '$time_local $remote_addr $request_method $uri -> $upstream_addr $status ${upstream_response_time}s';
  access_log /var/log/nginx/access.log lb buffer=64k flush=2s;

  limit_req_zone $binary_remote_addr zone=per_ip:20m rate=20r/s;
  limit_req_status 429;
  map $http_user_agent $bad_ua {
    default 0;
    "" 1;
    ~*(curl|wget|python-requests|scrapy|headlesschrome|phantomjs) 1;
  }

  upstream api {
    least_conn;
    # Compose service names (Docker's DNS). Fail fast and route around a dead replica.
    server api-1:4000 max_fails=1 fail_timeout=3s;
    server api-2:4000 max_fails=1 fail_timeout=3s;
    server api-3:4000 max_fails=1 fail_timeout=3s;
    keepalive 128;
  }

  proxy_cache_path /var/cache/nginx/deal levels=1:2 keys_zone=deal_status:10m max_size=50m inactive=10s;

  server {
    listen 80;
    client_max_body_size 16k;
    root /usr/share/nginx/html;
    gzip_static on;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location /assets/ {
      # Precompressed Brotli when the client (or the CDN edge) accepts it; else gzip_static / raw.
      set $br "";
      if ($http_accept_encoding ~* "\bbr\b") { set $br "A"; }
      if (-f "$request_filename.br") { set $br "${br}B"; }
      if ($br = AB) { rewrite ^ "$uri.br" last; }
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Vary Accept-Encoding;
      try_files $uri =404;
    }
    location ~ "^/assets/.+\.js\.br$"  { internal; types { } default_type text/javascript; include /etc/nginx/br-headers.conf; }
    location ~ "^/assets/.+\.css\.br$" { internal; types { } default_type text/css;        include /etc/nginx/br-headers.conf; }
    location ~ "^/assets/.+\.svg\.br$" { internal; types { } default_type image/svg+xml;   include /etc/nginx/br-headers.conf; }
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }

    location ~ "^/api/deals/[a-f0-9]{24}$" {
      proxy_cache deal_status;
      proxy_cache_valid 200 1s;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout;
      add_header X-Cache $upstream_cache_status;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://api;
    }

    location ~ "^/api/deals/[a-f0-9]{24}/(reserve|queue)$" {
      if ($bad_ua) { return 403; }
      limit_req zone=per_ip burst=10 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 500ms;
      proxy_read_timeout 10s;
      proxy_pass http://api;
    }

    # Gateway webhooks: signature-checked by the API, never rate-limited here.
    location = /api/webhooks/gateway {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://api;
    }

    location /api/ {
      limit_req zone=per_ip burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 500ms;
      proxy_read_timeout 10s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_pass http://api;
    }
  }
}
