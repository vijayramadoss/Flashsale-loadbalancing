# CDN edge container (pull-through cache) in front of the `web` origin.
# Same design as infra/cdn.local.conf: the browser gets HTML + /api from
# web (:8080) and every built asset from this edge (:8081), which only asks
# the origin on a cache miss.
worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  log_format cdn '$time_local $remote_addr $request_method $uri cache=$upstream_cache_status enc=$cdn_encoding $status $body_bytes_sent';
  access_log /var/log/nginx/access.log cdn buffer=64k flush=2s;

  map $http_accept_encoding $cdn_encoding {
    default        "";
    "~*\bbr\b"     br;
    "~*\bgzip\b"   gzip;
  }

  upstream origin {
    server web:80;
    keepalive 16;
  }

  proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:20m max_size=1g inactive=30d use_temp_path=off;

  server {
    listen 80;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location /api/ { return 404; }
    location = / { return 404; }
    location = /index.html { return 404; }

    location / {
      limit_except GET HEAD { deny all; }

      proxy_cache cdn;
      proxy_cache_key "$uri$is_args$args|$cdn_encoding";
      proxy_cache_valid 404 10s;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_revalidate on;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Accept-Encoding $cdn_encoding;
      proxy_set_header User-Agent "FlashSale-CDN-Edge/1.0";
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_pass http://origin;

      add_header X-Cache $upstream_cache_status always;
      add_header X-CDN-Edge "docker-edge-1" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Timing-Allow-Origin "*" always;
    }
  }
}
