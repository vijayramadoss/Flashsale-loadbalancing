# Local load-balancer demo (Windows, NGINX 1.28 in E:\tools\nginx-1.28.0).
# Start:  E:\tools\nginx-1.28.0\nginx.exe -p E:/tools/nginx-1.28.0/ -c E:/goMl/infra/nginx.local.conf
# Stop:   E:\tools\nginx-1.28.0\nginx.exe -p E:/tools/nginx-1.28.0/ -c E:/goMl/infra/nginx.local.conf -s quit
#
#   browser / simulator ──▶ NGINX :8088 ──┬──▶ api-1 :4001 ─┐
#                                          ├──▶ api-2 :4002 ─┼──▶ Redis + MongoDB (shared)
#                                          └──▶ api-3 :4003 ─┘
#
# Differences from the production reference (infra/nginx.conf):
#  * Windows NGINX runs one worker using select(): ~1,000 concurrent connections max.
#  * The simulator runs on this machine, so every request arrives from 127.0.0.1.
#    To still rate-limit "per client", the demo keys limits on the client address
#    the simulator sends in X-Forwarded-For. NEVER do this on a public server —
#    clients can forge that header; production keys on $binary_remote_addr.

worker_processes 1;
error_log logs/lb-error.log warn;
pid logs/lb-nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       E:/tools/nginx-1.28.0/conf/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Which replica served each request, and how long it took (used to explain the balancing).
  log_format lb '$time_local $request_method $uri -> $upstream_addr $status ${upstream_response_time}s';
  access_log logs/lb-access.log lb buffer=64k flush=2s;

  # ---- edge protection ----
  map $http_x_forwarded_for $client_key { default $http_x_forwarded_for; "" $binary_remote_addr; }
  limit_req_zone $client_key zone=per_client:20m rate=20r/s;
  limit_req_status 429;
  map $http_user_agent $bad_ua {
    default 0;
    "" 1;
    ~*(curl|wget|python-requests|scrapy|headlesschrome|phantomjs) 1;
  }

  # ---- the pool of stateless API replicas ----
  upstream api {
    least_conn;                                   # new request → replica with fewest active requests
    server 127.0.0.1:4001 max_fails=3 fail_timeout=5s;
    server 127.0.0.1:4002 max_fails=3 fail_timeout=5s;
    server 127.0.0.1:4003 max_fails=3 fail_timeout=5s;
    keepalive 64;                                 # reuse upstream connections (no TCP handshake per request)
  }

  # 1-second micro-cache for the public deal status that every shopper polls.
  proxy_cache_path E:/tools/nginx-1.28.0/temp/deal_cache levels=1:2 keys_zone=deal_status:10m max_size=20m inactive=10s;

  server {
    listen 127.0.0.1:8088;
    server_name localhost;
    client_max_body_size 16k;

    # Static storefront straight from the build output (a CDN in production).
    root E:/goMl/frontend/dist;
    gzip_static on;                               # serve the precompressed *.gz files
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }

    # Proxy settings are repeated per location: NGINX does not inherit
    # proxy_set_header into a location that defines its own.

    location ~ "^/api/deals/[a-f0-9]{24}$" {
      proxy_cache deal_status;
      proxy_cache_valid 200 1s;
      proxy_cache_lock on;                        # collapse concurrent cache misses into ONE upstream request
      proxy_cache_use_stale updating error timeout;
      add_header X-Cache $upstream_cache_status;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://api;
    }

    location ~ "^/api/deals/[a-f0-9]{24}/reserve$" {
      if ($bad_ua) { return 403; }
      limit_req zone=per_client burst=10 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_pass http://api;
    }

    # Gateway webhooks: all come from the gateway's few addresses, so a per-client
    # rate limit would throttle them (found in testing: 812 webhook 429s). They are
    # authenticated by their HMAC signature in the API instead.
    location = /api/webhooks/gateway {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://api;
    }

    location /api/ {
      limit_req zone=per_client burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      # A replica that is down or errors → try the next one (GET only; POST is never retried by default).
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_pass http://api;
    }
  }
}
